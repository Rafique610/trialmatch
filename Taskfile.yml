version: "3"

# Each placeholder is filled in by the card named next to it.
tasks:
  setup:
    desc: Install Python dependencies (GPU PyTorch included)
    cmds:
      - uv sync

  gpu:
    desc: Check PyTorch can see the GPU
    cmds:
      - uv run python -c "import torch; print('cuda', torch.cuda.is_available(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else '')"

  test:
    desc: Run all tests
    cmds:
      - uv run pytest -q

  test-gpu:
    desc: Run the slow GPU tests on the real model (KV cache equivalence, ...)
    env:
      HF_HUB_OFFLINE: "1"
    cmds:
      - uv run pytest -q -m gpu

  research:
    desc: Pull model facts from Hugging Face and check draft/target tokenizers match (TRIA-2)
    env:
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
    cmds:
      - uv run python -m src.research.model_facts
      - uv run python -m src.speculative.check_tokenizers

  data:
    desc: Download dataset, build the 37/8/8 split + manifest, measure token lengths (TRIA-3/4)
    env:
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
    cmds:
      - uv run python -m src.data.split
      - uv run python -m src.data.lengths

  baseline:
    desc: Untrained Qwen2.5-1.5B on the validation split, scored -> results/baseline_val (TRIA-6)
    env:
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
    cmds:
      - uv run python -m src.finetune.predict --split val --run baseline_val

  train:
    desc: QLoRA sweep of every config in configs/ (5 epochs each, ~1 h per config on an RTX 3050), then the comparison table (TRIA-7)
    env:
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
    cmds:
      - uv run python -m src.finetune.sweep configs/A_r16.json configs/C_r16_weighted.json configs/B_r8.json configs/D_r16_lr5e-5.json

  train-report:
    desc: Rebuild results/finetune_runs.md and the validation curves from finished runs (TRIA-7)
    cmds:
      - uv run python -m src.finetune.sweep --report

  adapter-upload:
    desc: "Publish the chosen adapter + model card: task adapter-upload -- <user>/<repo> (needs hf auth login) (TRIA-7)"
    cmds:
      - uv run python -m scripts.upload_adapter {{.CLI_ARGS}}

  adapter-download:
    desc: Download the published adapter into checkpoints/final/ (TRIA-7)
    cmds:
      - uv run python -m scripts.download_adapter {{.CLI_ARGS}}

  eval:
    desc: "Score a run folder: task eval -- results/<run> (TRIA-5)"
    cmds:
      - uv run python -m src.eval.run {{.CLI_ARGS}}

  final-test:
    desc: One-time sealed test run, base vs fine-tuned, + comparison table (TRIA-8; protocol in results/test_protocol.md)
    env:
      HF_HUB_OFFLINE: "1"
    cmds:
      - uv run python -m src.finetune.predict --split test --run baseline_test
      - uv run python -m src.finetune.predict --split test --run finetuned_test --adapter checkpoints/final
      - uv run python -m src.eval.compare results/baseline_test results/finetuned_test > results/test_comparison.md

  bench:
    desc: KV cache equivalence + benchmark -> results/bench/kvcache.json (TRIA-9); attention and speculative added by TRIA-10/11
    env:
      HF_HUB_OFFLINE: "1"
    cmds:
      - uv run python -m src.kvcache.bench

  app:
    desc: Start backend and browser app (TRIA-12/13)
    cmds:
      - echo "not built yet — TRIA-12"
